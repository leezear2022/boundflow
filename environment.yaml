name: boundflow
channels:
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - cmake>=3.24
  - ninja>=1.11
  - ccache
  - make
  - llvmdev=20.1.8
  - clangdev=20.1.8
  # 提供可锁定的 nvcc/headers；PyTorch 自身仍只从官方 cu132 wheel 安装。
  - cuda-toolkit=13.2
  - numpy
  - scipy
  - cloudpickle
  - psutil
  - tornado
  - ml_dtypes
  - typing_extensions
  - attrs
  - decorator
  - packaging
  - xgboost
  - onnx
  - onnxoptimizer
  - onnxruntime
  - onnxscript
  - pyyaml
  - tqdm
  - appdirs
  - graphviz
  - python-graphviz
  - matplotlib
  - pytest
  - pytest-xdist
  - pytest-benchmark
  - pytest-order
  - pylint
  - black
  - mypy

# PyTorch/CUDA 有意不交给 Conda 求解。创建环境后由 install_dev.sh 的
# pytorch 阶段从官方 cu132 index 精确安装，防止 solver 改写 CUDA/PyTorch 版本。
